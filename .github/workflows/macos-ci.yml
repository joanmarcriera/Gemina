name: macOS CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/macos/**"
      - ".swiftlint.yml"
      - ".github/workflows/macos-ci.yml"
  # No path filter on pull_request: the swift job is required by branch
  # protection, so it must report a status on every PR (see go-ci.yml).
  pull_request:

env:
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"

jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - run: swift build --package-path apps/macos
      - name: Install pinned SwiftLint
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/portable_swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          (cd "${RUNNER_TEMP}" && echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c)
          unzip -q "${RUNNER_TEMP}/portable_swiftlint.zip" -d "${RUNNER_TEMP}/swiftlint"
          echo "${RUNNER_TEMP}/swiftlint" >> "$GITHUB_PATH"
      - run: swiftlint version
      - run: swiftlint lint --strict
