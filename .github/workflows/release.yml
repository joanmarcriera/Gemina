name: Release

# Pushing a tag such as v0.1.0 builds the release files and attaches them to a
# GitHub Release. No secrets are needed: without them the macOS build is
# unsigned (the README explains how to open it). If the signing secrets exist,
# the macOS tool is signed with a Developer ID, and notarised when the notary
# secrets exist too.
#
# Optional secrets: MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY,
# APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test before release
        run: go test ./...

      - name: Build files
        run: |
          set -euo pipefail
          mkdir -p dist work
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -o "work/geminactl-$arch" ./cmd/geminactl
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "work/gateway-$arch" ./cmd/gateway
          done
          lipo -create work/geminactl-arm64 work/geminactl-amd64 -output work/geminactl
          for arch in arm64 amd64; do
            mkdir -p "work/gw-$arch"
            cp "work/gateway-$arch" "work/gw-$arch/gateway"
            cp LICENSE NOTICE COMMERCIAL.md "work/gw-$arch/"
            tar -C "work/gw-$arch" -czf "dist/gemina-gateway-linux-$arch.tar.gz" .
          done

      - name: Sign geminactl (only if signing secrets exist)
        if: env.MACOS_CERT_P12_BASE64 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERT_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" work/geminactl
          codesign --verify --verbose work/geminactl
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package geminactl
        run: |
          set -euo pipefail
          mkdir -p work/ctl
          cp work/geminactl LICENSE NOTICE COMMERCIAL.md work/ctl/
          (cd work/ctl && zip -q -r ../../dist/geminactl-macos-universal.zip .)

      - name: Notarise geminactl (only if signing and notary secrets exist)
        if: env.MACOS_CERT_P12_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/geminactl-macos-universal.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          for f in ./*; do shasum -a 256 "$f"; done | sed 's# \./# #' > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          signed="unsigned"
          if [ -n "${MACOS_CERT_P12_BASE64:-}" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then signed="signed"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Pre-release. Not validated on real dual-uplink hardware. The macOS tool in this release is ${signed}; see the README section 'Install a release build' for how to open an unsigned file. Licence: PolyForm Noncommercial 1.0.0, commercial use needs a paid licence (COMMERCIAL.md)."
